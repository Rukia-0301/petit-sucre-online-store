<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カート</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="cart.css">
</head>

<body>
  <div id="root">
    <header class="header">
      <h1><a href="#" class="logo">Petit Sucre</a></h1>
      <a href="cart.html" class="cart-icon">
        <img src="icons/cart.svg" alt="">
        <span class="cart__total">0</span>
      </a>
      <div class="sp-hamburger">
        <span class="line"></span>
        <span class="line"></span>
      </div>
    </header>
    <main>
      <div class="container">
        <h2 class="content-title">カート</h2>
        <form action="https://formspree.io/f/mgaelyyp" method="post">
          <ul class="cart-items">
            <li class="cart-item">
              <div class="cart-item__image">
                <img src="./product-images/01_cakes.png" alt="">
              </div>
              <div class="cart-item__details">
                <div class="cart-item__info">
                  <div>
                    <h3>苺のショートケーキ</h3>
                    <p>￥1,160 (￥580 × 2個)</p>
                  </div>
                  <div>
                    <button type="button" class="cart-item__delete"><img src="icons/delete.svg" alt=""><span>削除</span></button>
                  </div>
                </div>
                <div class="cart-item__counter">
                  <button type="button">－</button>
                  <span>0</span>
                  <button type="button">＋</button>
                </div>
              </div>
            </li>
            <li class="cart-item">
              <div class="cart-item__image">
                <img src="./product-images/01_cakes.png" alt="">
              </div>
              <div class="cart-item__details">
                <div class="cart-item__info">
                  <div>
                    <h3>苺のショートケーキ</h3>
                    <p>￥1,160 (￥580 × 2個)</p>
                  </div>
                  <div>
                    <button type="button" class="cart-item__delete"><img src="icons/delete.svg" alt=""><span>削除</span></button>
                  </div>
                </div>
                <div class="cart-item__counter">
                  <button type="button">－</button>
                  <span>0</span>
                  <button type="button">＋</button>
                </div>
              </div>
            </li>
          </ul>
          <p class="total">合計： 2,320円</p>
          <button type="submit" class="cart-items__checkout"></button>
        </form>
      </div>
    </main>
    <footer class="footer">
      <a href="#" class="logo">Petit Sucre</a>
      <small>&copy; Petit Sucre</small>
    </footer>
  </div>
</body>

</html>
