<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カート</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="cart.css">
</head>

<body>
  <div id="root">
    <header class="header">
      <h1><a href="index.html" class="logo">Petit Sucre</a></h1>
      <a href="cart.html" class="cart-icon">
        <img src="icons/cart.svg" alt="">
        <span class="cart__total">0</span>
      </a>
      <div class="sp-hamburger">
        <span class="line"></span>
        <span class="line"></span>
      </div>
    </header>
    <main>
      <div class="container">
        <h2 class="content-title">カート</h2>
      </div>
    </main>

    <script type="text/babel">
      'use strict';
      {
        const CartItem = (props) => {
          const decrementCount = () => {
            props.onDecrement(props.product.id);
          };
          const incrementCount = () => {
            props.onIncrement(props.product.id);
          };

          const handleDeleteItem = () => {
            props.onDelete(props.product.id);
          };

          return (
            <li className="cart-item">
              <div className="cart-item__image">
                <img src={props.product.image} alt="商品画像" />
              </div>
              <div className="cart-item__details">
                <div className="cart-item__info">
                  <div>
                    <h3>{props.product.name}</h3>
                    <p>￥{Number(props.product.price * props.count).toLocaleString()}　(￥{props.product.price} × {props.count}個)</p>
                  </div>
                  <div className="cart-item__delete-area">
                    <button onClick={handleDeleteItem} type="button" className="cart-item__delete">
                      <img src="icons/delete.svg" alt="削除ボタン" /><span>削除</span>
                    </button>
                  </div>
                </div>
                <div className="cart-item__counter">
                  <button onClick={decrementCount} type="button">－</button>
                  <span>{props.count}</span>
                  <button onClick={incrementCount} type="button">＋</button>
                </div>
              </div>

              <input
                type="hidden"
                name={`product_id_${props.product.id}_name`}
                value={props.product.name}
              />
              <input
                type="hidden"
                name={`product_id_${props.product.id}_price`}
                value={props.product.price}
              />
              <input
                type="hidden"
                name={`product_id_${props.product.id}_count`}
                value={props.count}
              />
            </li>
          );
        };

        const App = () => {
          const [products, setProducts] = React.useState([]);

          const [counts, setCounts] = React.useState({});

          const [isLoading, setIsLoading] = React.useState(true);

          React.useEffect(() => {
            const getProducts = async () => {
              try {
                const response = await fetch('./products.json');
                const productsData = await response.json();
                if (!response.ok) {
                  throw new Error(`HTTPエラー：${response.status} ${response.statusText}`);
                }
                setProducts(productsData);
              } catch (err) {
                console.log('商品データの取得に失敗しました' + err);
              } finally {
                setIsLoading(false);
              }
            };
            getProducts();

            if (localStorage.getItem('counts') !== null) {
              setCounts(JSON.parse(localStorage.getItem('counts')));
            }
          }, []);

          React.useEffect(() => {
            localStorage.setItem('counts', JSON.stringify(counts));
          }, [counts]);

          const decrementProductCount = (id) => {
            if (counts[id] === 0) {
              return;
            }
            if (counts[id] === 1) {
              if (!confirm(`${products.find((product) => product.id === id).name} をカートから削除しますか？`)) {
                return;
              }
            }
            setCounts({ ...counts, [id]: counts[id] - 1 });
          };

          const incrementProductCount = (id) => {
            if (counts[id] >= 99) {
              return;
            }
            setCounts({ ...counts, [id]: counts[id] + 1 });
          };

          const handleDeleteCartItem = (id) => {
            if (!confirm(`${products.find((product) => product.id === id).name} をカートから削除しますか？`)) {
              return;
            }
            setCounts({ ...counts, [id]: 0 });
          };

          const handleCheckoutCartItems = async (e) => {
            e.preventDefault();
            if (!confirm('購入を確定しますか？')) {
              return;
            }
            const form = e.currentTarget;
            const formData = new FormData(form);
            try {
              const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                  'Accept': 'application/json'
                }
              });

              if (!response.ok) {
                throw new Error(`HTTPエラー：${response.status}`);
              }
              setCounts(Object.fromEntries(products.map((product) =>
                [product.id, 0])
              ));
              window.location.href = './thanks.html';

            } catch (err) {
              console.error(err);
              alert('注文データの送信に失敗しました。もう一度お試しください');
            }
          };

          const selectedItems = products.filter((product) => {
            return counts[product.id] > 0;
          });

          const noItemMessage = <p className="cart-items__message">カート内に商品はありません</p>;

          const cartItems = selectedItems.map((product) => {
            return (
              <CartItem
                key={product.id}
                product={product}
                count={counts[product.id]}
                onDecrement={decrementProductCount}
                onIncrement={incrementProductCount}
                onDelete={handleDeleteCartItem}
              />
            );
          });

          const totalQuantity = Object.values(selectedItems).reduce((result, product) => {
            return result + counts[product.id];
          }, 0);

          const totalAmount = selectedItems.reduce((result, product) => {
            return result + product.price * counts[product.id];
          }, 0);

          return (
            <>
              <header className="header">
                <h1><a href="#" className="logo">Petit Sucre</a></h1>
                <a href="cart.html" className="cart-icon">
                  <img src="icons/cart.svg" alt="カート" />
                  <span className="cart__total">{totalQuantity}</span>
                </a>
                <div className="sp-hamburger">
                  <span className="line"></span>
                  <span className="line"></span>
                </div>
              </header>
              <main>
                <h2 className="content-title">カート</h2>
                <form onSubmit={handleCheckoutCartItems} action="https://formspree.io/f/mgaelyyp" method="post">
                  <ul className="cart-items container">
                    {isLoading ? <li><p className="cart-items__message">読み込み中...</p></li> :
                      selectedItems.length === 0 ? noItemMessage :
                        <>{cartItems} <li><p className="cart-items__message">すべての商品を表示しました</p></li></>}
                  </ul>
                  <div className="cart-items__checkout-bar">
                    <div className="container">
                      <p className="cart-items__total">合計： {Number(totalAmount).toLocaleString()}円</p>
                      <div className="pc-style__checkout-flex">
                        <button type="submit" className="cart-items__checkout" disabled={selectedItems.length === 0 ? true : false}>購入を確定</button>
                        <a href="products.html">お買い物を続ける</a>
                      </div>
                    </div>
                  </div>
                </form>
              </main>
            </>
          );
        };

        const root = ReactDOM.createRoot(document.querySelector('#root'));
        root.render(<App />);
      }
    </script>
  </div>
</body>

</html>
