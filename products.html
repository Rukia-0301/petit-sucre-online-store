<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品一覧</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="products.css">
</head>

<body>
  <div id="root">
    <header class="header">
      <h1><a href="#" class="logo">Petit Sucre</a></h1>
      <a href="cart.html" class="cart-icon">
        <img src="icons/cart.svg" alt="">
        <span class="cart__total">0</span>
      </a>
      <div class="sp-hamburger">
        <span class="line"></span>
        <span class="line"></span>
      </div>
    </header>
    <main>
      <div class="container">
        <form class="search-form">
          <input type="text" placeholder="商品名で検索">
          <button>検索</button>
        </form>
        <div class="select-category">
          <p>絞り込み：</p>
          <select>
            <option value="all">すべて</option>
            <option value="all">ケーキ</option>
            <option value="all">タルト</option>
            <option value="all">クッキー</option>
            <option value="all">焼き菓子</option>
          </select>
        </div>
      </div>
    </main>
    <footer class="footer">
      <a href="#" class="logo">Petit Sucre</a>
      <small>&copy; Petit Sucre</small>
    </footer>
  </div>

  <script type="text/babel">
    'use strict';
    {
      const categories = [
        { "name": "ケーキ", "className": "cakes" },
        { "name": "タルト", "className": "tarts" },
        { "name": "クッキー", "className": "cookies" },
        { "name": "マカロン", "className": "macarons" },
        { "name": "焼き菓子", "className": "baked-goods" }
      ];

      const SelectOption = (props) => {
        return (
          <option value={props.category}>{props.name}</option>
        );
      };

      const ProductCard = (props) => {
        const decrementCount = () => {
          props.onDecrement(props.product.id);
        };

        const incrementCount = () => {
          props.onIncrement(props.product.id);
        };

        const handleResetCount = () => {
          props.onReset(props.product);
        };

        const addCartBtn = (
          <div className="products__btn">
            <button onClick={incrementCount} className="add-cart">カートに追加</button>
          </div>
        );

        const counterBtn = (
          <div className="products__btn select-count">
            <div className="flex">
              <button onClick={decrementCount}>−</button>
              <span>{props.count}</span>
              <button onClick={incrementCount}>+</button>
            </div>
            <button onClick={handleResetCount} className="count-reset">
              <img src="icons/trash.svg" />
            </button>
          </div>
        );

        return (
          <div className="products__card">
            <div>
              <img src={props.product.image} alt="" />
            </div>
            <p className="product-name">{props.product.name}</p>
            <p>￥{Number(props.product.price).toLocaleString()}</p>
            {
              props.count === 0 ? addCartBtn : counterBtn
            }
          </div>
        );
      };

      const App = () => {
        const [counts, setCounts] = React.useState({});

        const [total, setTotal] = React.useState(0);

        const [products, setProducts] = React.useState([]);

        const [searchText, setSearchText] = React.useState('');

        const [filterdSearchProducts, setFilterdSearchProducts] = React.useState([]);

        const [selectCategory, setSelectCategory] = React.useState('');

        React.useEffect(() => {
          const getProducts = async () => {
            try {
              const response = await fetch('./products.json');
              const productsData = await response.json();
              setProducts(productsData);
              setFilterdSearchProducts(productsData);
              if (localStorage.getItem('counts') === null) {
                setCounts(Object.fromEntries(productsData.map((product) => [product.id, 0])));
              } else {
                setCounts(JSON.parse(localStorage.getItem('counts')));
              }
            } catch (err) {
              console.log('商品データの取得に失敗しました');
            }
          };
          getProducts();
        }, []);

        React.useEffect(() => {
          if (Object.keys(counts).length === 0) {
            return;
          }
          localStorage.setItem('counts', JSON.stringify(counts));
          setTotal(
            Object.values(counts).reduce((result, count) => {
              return result + count;
            }, 0)
          );
        }, [counts]);

        const searchFormInputRef = React.useRef(null);

        const handleSearchFormSubmit = (e) => {
          e.preventDefault();
          setSelectCategory('');
          setFilterdSearchProducts(products.filter((product) => {
            return product.name.includes(searchText) || product.kana.includes(searchText);
          }));
          searchFormInputRef.current?.blur();
        };

        const handleSearchTextChange = (e) => {
          setSearchText(e.currentTarget.value);
          if (e.currentTarget.value === '') {
            setFilterdSearchProducts(products);
          }
        }

        const handleSelectCategoryChange = (e) => {
          setSearchText('');
          setFilterdSearchProducts(products);
          const selectedCategory = e.currentTarget.value;
          setSelectCategory(selectedCategory);
        };

        const decrementProductCount = (id) => {
          setCounts({ ...counts, [id]: counts[id] - 1 });
        };

        const incrementProductCount = (id) => {
          setCounts({ ...counts, [id]: counts[id] + 1 });
        };

        const ResetProductCount = (product) => {
          if (!confirm(product.name + 'をカートから削除しますか？')) {
            return;
          }
          setCounts({ ...counts, [product.id]: 0 });
        };

        const filterdProducts = filterdSearchProducts.filter((product) => {
          if (selectCategory === '') {
            return true;
          }
          return product.category === selectCategory;
        });

        const categoryItems = categories.map((category) => {
          return (
            <SelectOption
              key={category.className}
              name={category.name}
              category={category.className}
            />
          );
        });

        const productCards = filterdProducts.map((product) => {
          return (
            <ProductCard
              key={product.id}
              product={product}
              count={counts[product.id]}
              onDecrement={decrementProductCount}
              onIncrement={incrementProductCount}
              onReset={ResetProductCount}
            />
          );
        });

        return (
          <>
            <header className="header">
              <h1><a href="#" className="logo">Petit Sucre</a></h1>
              <a href="cart.html" className="cart-icon">
                <img src="icons/cart.svg" alt="カート" />
                <span className="cart__total">{total}</span>
              </a>
              <div className="sp-hamburger">
                <span className="line"></span>
                <span className="line"></span>
              </div>
            </header>
            <main>
              <div className="container">
                <form onSubmit={handleSearchFormSubmit} className="search-form">
                  <input type="text" onChange={handleSearchTextChange} value={searchText} placeholder="商品名で検索" ref={searchFormInputRef} />
                  <button>検索</button>
                </form>
                <div className="select-category">
                  <p>絞り込み：</p>
                  <select onChange={handleSelectCategoryChange} value={selectCategory}>
                    <option value="">すべて</option>
                    {categoryItems}
                  </select>
                </div>
                <div className="products">
                  {
                    productCards.length !== 0 ? productCards :
                      <p className="undefined-products-message">商品が見つかりませんでした</p>
                  }
                </div>
              </div>
            </main>
            <footer className="footer">
              <a href="#" className="logo">Petit Sucre</a>
              <small>&copy; Petit Sucre</small>
            </footer>
          </>
        );
      };
      const root = ReactDOM.createRoot(document.querySelector('#root'));
      root.render(<App />);
    }
  </script>
</body>

</html>
